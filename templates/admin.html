<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 2rem; }
        .container { background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); max-width: 900px; margin: auto; }
        h1, h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.75rem; text-align: left; }
        th { background-color: #f2f2f2; }
        .support-item { border-bottom: 1px solid #ccc; padding-bottom: 1rem; margin-bottom: 1rem; }
        .support-item form { display: inline; }
        .support-item button { padding: 0.5rem; margin-left: 0.5rem; border: none; border-radius: 4px; cursor: pointer; }
        .respond-btn { background-color: #28a745; color: white; }
        .ignore-btn { background-color: #dc3545; color: white; }
        .logout-btn { float: right; padding: 0.5rem 1rem; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .logout-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <button class="logout-btn" onclick="window.location.href='/logout'">Logout</button>
    <div class="container">
        <h1>Admin Dashboard</h1>

        <div class="user-management-section">
            <h2>Registered Users</h2>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Last Login</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user[0] }}</td>
                        <td>{{ user[1] }}</td>
                        <td>
                            <form action="/delete_user" method="post" style="display:inline;">
                                <input type="hidden" name="username" value="{{ user[0] }}">
                                <button type="submit">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="support-management-section">
            <h2>Support Queries</h2>
            {% for query in queries %}
            <div class="support-item">
                <p><strong>From:</strong> {{ query[1] }} ({{ query[2] }})</p>
                <p><strong>Feedback:</strong> {{ query[3] }}</p>
                <form action="/respond_feedback" method="post">
                    <input type="hidden" name="query_id" value="{{ query[0] }}">
                    <button class="respond-btn" type="submit">Respond</button>
                </form>
                <form action="/ignore_feedback" method="post" onsubmit="return confirm('Are you sure you want to ignore and delete this feedback?');">
                    <input type="hidden" name="query_id" value="{{ query[0] }}">
                    <button class="ignore-btn" type="submit">Ignore & Delete</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
