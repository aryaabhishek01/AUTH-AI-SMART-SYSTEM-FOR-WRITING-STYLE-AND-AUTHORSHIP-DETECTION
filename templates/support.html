<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Page</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .support-container { background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); max-width: 500px; width: 90%; text-align: center; }
        .support-container h2 { margin-bottom: 1.5rem; }
        .support-container input, .support-container textarea { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .support-container button { width: 100%; padding: 0.75rem; border: none; background-color: #17a2b8; color: white; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .support-container button:hover { background-color: #138496; }
        .back-btn { margin-top: 1rem; display: block; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <div class="support-container">
        <h2>Support Page</h2>
        <p>We're here to help! Please fill out the form below with your query.</p>
        <form action="/submit_feedback" method="post">
            <input type="email" name="email" placeholder="Your Email" required>
            <input type="tel" name="phone" placeholder="Your Phone Number">
            <textarea name="feedback" placeholder="Your feedback or query..." required></textarea>
            <button type="submit">Submit Feedback</button>
        </form>
        <a href="/user" class="back-btn">Back to Dashboard</a>
    </div>
</body>
</html>
